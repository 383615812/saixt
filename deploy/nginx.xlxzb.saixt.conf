# ============================================================
# saixt 部署到 https://www.xlxzb.com/saixt 的 Nginx 子路径配置
# ------------------------------------------------------------
# 用法（二选一）：
#   A. 最简（推荐）：把下面两个 location 块【插入】到新服务器现有
#      `listen 443 ssl` 的 server 块内（放在原有 `location /` 之前即可）。
#      现有根路径 `/` 与 `/xiaolongxia/` 保持不动，互不影响。
#   B. 若新服务器 80 端口不是“全部 301 跳 https”，请同样把
#      `location /saixt/` 块复制到 80 的 server 块内（或确认 80 已全量跳转）。
#
# 架构说明（与旧服务器 62.234.79.165 一致，已验证）：
#   Nginx 把 `/saixt/` 整体反代到后端 Node(3000)，并剥离 `/saixt` 前缀；
#   后端 index.js 已同时托管 SPA 静态(/saixt 静态挂载 + 根静态 + catch-all)
#   与 `/api` 接口，因此 Nginx 只需转发，无需再单独配 /assets 静态。
# ============================================================

# ---- 子路径入口：剥离 /saixt 前缀反代到后端 ----
# 用 ^~ 修饰符：若现有 443 server 内有正则静态资源 location
# (如 location ~* \.(js|css|png|...)$)，^~ 可让此前缀 location 优先，
# 避免 /saixt/assets/*.js 被正则块拦截而 404。
location ^~ /saixt/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 答疑接口最长约 90s，留足余量
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# ---- 题目图片（对应后端 /qimages 静态目录）----
location ^~ /qimages/ {
    proxy_pass http://127.0.0.1:3000;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
