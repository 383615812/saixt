# Nginx 反向代理 + HTTPS 终结 + 静态加速
# 放置到 /etc/nginx/conf.d/ 下，替换两个 <你的域名> 占位并签发证书后 reload。
# 注意：本配置在 Nginx 一侧终结 HTTPS，Node 进程只监听内网 3000。
#       必须保持 server 端 TRUST_PROXY=1，inbound 请求头会带 X-Forwarded-For。
server {
    listen 80;
    server_name <你的域名>;
    # http → https 强制跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <你的域名>;

    # 证书（certbot 生成）
    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 请求体上限：与后端 express.json(limit:'2mb') 保持一致
    client_max_body_size 2m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态构建产物与题库图片由 Nginx 直接服务，减轻 Node 压力
    location /qimages/ {
        alias /opt/saixt/server/public/qimages/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA 静态资源（前端构建产物，带 hash，长缓存）
    location /assets/ {
        alias /opt/saixt/web/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # favicon / 其它静态
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        root /opt/saixt/web/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长请求（AI 答疑最长 90s）不因空闲超时被掐断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余（SPA history 路由）一律回落到 index.html，由前端路由接管
    location / {
        root /opt/saixt/web/dist;
        try_files $uri $uri/ /index.html;
    }
}